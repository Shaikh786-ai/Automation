name: Assign F&O Access (Correct Provisioning Model)

on:
  workflow_dispatch:
    inputs:
      fno_url:
        required: true
        type: string
        description: "F&O Environment URL"

      user_email:
        required: true
        type: string
        description: "User Email"

permissions:
  id-token: write
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Mask inputs
      # =========================
      - name: Set Inputs
        id: vars
        run: |
          echo "::add-mask::${{ github.event.inputs.fno_url }}"
          echo "::add-mask::${{ github.event.inputs.user_email }}"

          echo "fno_url=${{ github.event.inputs.fno_url }}" >> $GITHUB_OUTPUT
          echo "user_email=${{ github.event.inputs.user_email }}" >> $GITHUB_OUTPUT

      # =========================
      # Get F&O Token
      # =========================
      - name: Get F&O Token
        id: token
        run: |
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${{ secrets.PP_TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.PP_CLIENT_SECRET }}" \
            -d "scope=https://*.operations.dynamics.com/.default" \
            -d "grant_type=client_credentials" | jq -r .access_token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "Token failure"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # =========================
      # WAIT FOR F&O AAD SYNC (REAL SOURCE OF USER)
      # =========================
      - name: Wait for F&O User Sync
        run: |
          FNO_URL="${{ steps.vars.outputs.fno_url }}"
          TOKEN="${{ steps.token.outputs.token }}"
          USER="${{ steps.vars.outputs.user_email }}"

          echo "Waiting for F&O to auto-sync user from Entra ID..."

          for i in {1..60}
          do
            RESPONSE=$(curl -s "$FNO_URL/data/SystemUsers?\$filter=UserId eq '$USER'" \
              -H "Authorization: Bearer $TOKEN")

            COUNT=$(echo "$RESPONSE" | jq '.value | length')
            AAD=$(echo "$RESPONSE" | jq -r '.value[0].AzureActiveDirectoryObjectId // empty')
            ACTIVE=$(echo "$RESPONSE" | jq -r '.value[0].Enabled // false')

            echo "Attempt $i - Found: $COUNT | AAD: $AAD | Active: $ACTIVE"

            if [ "$COUNT" != "0" ] && [ "$AAD" != "" ]; then
              echo "User successfully synced in F&O"
              exit 0
            fi

            sleep 30
          done

          echo "User NOT synced into F&O"
          exit 1

      # =========================
      # ASSIGN SYSTEM ADMIN ROLE
      # =========================
      - name: Assign System Administrator Role
        run: |
          FNO_URL="${{ steps.vars.outputs.fno_url }}"
          TOKEN="${{ steps.token.outputs.token }}"
          USER="${{ steps.vars.outputs.user_email }}"

          echo "Assigning System Administrator role..."

          for i in {1..25}
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$FNO_URL/data/SecurityUserRoles" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"UserId\": \"$USER\",
                \"SecurityRoleIdentifier\": \"System administrator\"
              }")

            echo "Attempt $i - HTTP: $STATUS"

            if [ "$STATUS" == "200" ] || [ "$STATUS" == "201" ]; then
              echo "Role assigned successfully"
              exit 0
            fi

            sleep 20
          done

          echo "Role assignment failed"
          exit 1

      # =========================
      # VERIFY ROLE
      # =========================
      - name: Verify Role Assignment
        run: |
          FNO_URL="${{ steps.vars.outputs.fno_url }}"
          TOKEN="${{ steps.token.outputs.token }}"
          USER="${{ steps.vars.outputs.user_email }}"

          RESPONSE=$(curl -s "$FNO_URL/data/SecurityUserRoles?\$filter=UserId eq '$USER'" \
            -H "Authorization: Bearer $TOKEN")

          COUNT=$(echo "$RESPONSE" | jq '.value | length')

          if [ "$COUNT" -eq "0" ]; then
            echo "Role NOT applied"
            exit 1
          fi

          echo "Role successfully applied"

      # =========================
      # FINAL SUMMARY
      # =========================
      - name: Summary
        run: |
          echo "===================================="
          echo "F&O PROVISIONING SUCCESSFUL"
          echo "User: ${{ steps.vars.outputs.user_email }}"
          echo "Status: READY FOR LOGIN"
          echo "===================================="

name: Assign F&O Access (Existing Environment)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        required: true
        type: string

      fno_url:
        required: true
        description: "Paste the existing F&O URL of the UDE environment"
        type: string

      user_email:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Load F&O URL directly from input
      # =========================
      - name: Set F&O URL
        id: fno
        run: |
          FNO_URL="${{ github.event.inputs.fno_url }}"

          if [ -z "$FNO_URL" ]; then
            echo "F&O URL is missing"
            exit 1
          fi

          echo "fno_url=$FNO_URL" >> $GITHUB_OUTPUT

      # =========================
      # Get F&O Token (App-only auth)
      # =========================
      - name: Get F&O Token
        id: token
        run: |
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${{ secrets.PP_TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.PP_CLIENT_SECRET }}" \
            -d "scope=https://*.operations.dynamics.com/.default" \
            -d "grant_type=client_credentials" | jq -r .access_token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "Failed to get F&O token"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # =========================
      # Create F&O User
      # =========================
      - name: Create F&O User
        run: |
          curl -X POST "${{ steps.fno.outputs.fno_url }}/data/SystemUsers" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "UserId": "${{ github.event.inputs.user_email }}",
              "UserName": "${{ github.event.inputs.user_email }}",
              "Enabled": true
            }'

      # =========================
      # Assign System Admin Role
      # =========================
      - name: Assign System Administrator Role
        run: |
          curl -X POST "${{ steps.fno.outputs.fno_url }}/data/SecurityUserRoles" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "UserId": "${{ github.event.inputs.user_email }}",
              "SecurityRoleIdentifier": "System administrator"
            }'

      # =========================
      # Summary
      # =========================
      - name: Summary
        run: |
          echo "===================================="
          echo "F&O USER ASSIGNMENT COMPLETED"
          echo "Environment: ${{ github.event.inputs.environment_name }}"
          echo "F&O URL: ${{ github.event.inputs.fno_url }}"
          echo "User: ${{ github.event.inputs.user_email }}"
          echo "===================================="

name: Create UDE Environment (OIDC)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        required: true
        type: string

      domain_name:
        required: true
        type: string

      environment_type:
        required: true
        default: Sandbox
        type: choice
        options: [Sandbox, Production, Trial]

      region:
        required: true
        default: unitedstates
        type: string

      currency:
        required: true
        default: USD
        type: string

      language:
        required: true
        default: "1033"
        type: string

      templates:
        required: true
        default: D365_FinOps_Finance
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  create-ude:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔐 OIDC Login to Azure
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          allow-no-subscriptions: true

      # Install PAC CLI
      - name: Install PAC CLI
        uses: microsoft/powerplatform-actions/actions-install@v1.9.1

      # Authenticate PAC using OIDC context
      - name: PAC Auth (OIDC)
        run: |
          pac auth create \
            --name oidc-auth \
            --kind ORGANIZATION \
            --tenant ${{ secrets.PP_TENANT_ID }}

      # Create environment
      - name: Create UDE Environment
        uses: microsoft/powerplatform-actions/create-environment@v1.9.1
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

          name: ${{ github.event.inputs.environment_name }}
          environment-type: ${{ github.event.inputs.environment_type }}
          region: ${{ github.event.inputs.region }}
          currency: ${{ github.event.inputs.currency }}
          language: ${{ github.event.inputs.language }}
          domain-name: ${{ github.event.inputs.domain_name }}
          templates: ${{ github.event.inputs.templates }}

      # Wait for readiness
      - name: Wait for environment
        run: |
          for i in {1..60}
          do
            STATUS=$(pac admin list --output json \
              | jq -r '.[] | select(.DisplayName=="${{ github.event.inputs.environment_name }}") | .State')

            echo "Status: $STATUS"

            if [ "$STATUS" == "Ready" ]; then
              exit 0
            fi

            sleep 60
          done

          exit 1

      # Extract F&O URL
      - name: Extract F&O URL
        id: fno
        run: |
          FNO_URL=$(pac admin list --output json | jq -r '
            .[]
            | select(.DisplayName=="${{ github.event.inputs.environment_name }}")
            | .LinkedEnvironmentMetadata.instanceUrl
          ')

          echo "fno_url=$FNO_URL" >> $GITHUB_OUTPUT

      # Save artifact
      - uses: actions/upload-artifact@v4
        with:
          name: fno-url
          path: <(echo "${{ steps.fno.outputs.fno_url }}")

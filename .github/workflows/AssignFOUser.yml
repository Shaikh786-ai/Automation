name: Assign F&O User Access

on:
  workflow_dispatch:
    inputs:
      user_email:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  assign-user:
    runs-on: ubuntu-latest

    steps:
      - name: Download F&O URL artifact
        uses: actions/download-artifact@v4
        with:
          name: fno-url

      - name: Read F&O URL
        id: fno
        run: |
          FNO_URL=$(cat fno_url.txt)
          echo "FNO_URL=$FNO_URL"
          echo "fno_url=$FNO_URL" >> $GITHUB_OUTPUT

      - name: Get F&O access token
        id: token
        run: |
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${{ secrets.PP_TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.PP_CLIENT_SECRET }}" \
            -d "scope=https://*.operations.dynamics.com/.default" \
            -d "grant_type=client_credentials" | jq -r .access_token)

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Wait for F&O stabilization (safe buffer)
        run: |
          echo "Waiting 10 minutes for backend stabilization..."
          sleep 600

      - name: Create F&O user
        run: |
          curl -X POST "${{ steps.fno.outputs.fno_url }}/data/SystemUsers" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "UserId": "${{ github.event.inputs.user_email }}",
              "UserName": "${{ github.event.inputs.user_email }}",
              "Enabled": true
            }'

      - name: Assign System Admin Role
        run: |
          curl -X POST "${{ steps.fno.outputs.fno_url }}/data/SecurityUserRoles" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "UserId": "${{ github.event.inputs.user_email }}",
              "SecurityRoleIdentifier": "System administrator"
            }'

      - name: Summary
        run: |
          echo "===================================="
          echo "F&O USER ACCESS GRANTED"
          echo "User: ${{ github.event.inputs.user_email }}"
          echo "F&O URL: ${{ steps.fno.outputs.fno_url }}"
          echo "===================================="

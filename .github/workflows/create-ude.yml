name: Create UDE + F&O Access (End-to-End)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        required: true
        type: string

      domain_name:
        required: true
        type: string

      user_email:
        required: true
        type: string

      environment_type:
        required: true
        default: Sandbox
        type: choice
        options: [Sandbox, Production, Trial]

      region:
        required: true
        default: unitedstates
        type: string

      currency:
        required: true
        default: USD
        type: string

      language:
        required: true
        default: "1033"
        type: string

      templates:
        required: true
        default: D365_FinOps_Finance
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  create-ude:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ============================
      # Install Power Platform CLI
      # ============================
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      # ============================
      # Authenticate FIRST (important fix)
      # ============================
      - name: Authenticate PAC
        run: |
          pac auth create \
            --applicationId ${{ secrets.CLIENT_ID }} \
            --clientSecret ${{ secrets.PP_CLIENT_SECRET }} \
            --tenant ${{ secrets.PP_TENANT_ID }}

      # ============================
      # Create Environment (FIXED)
      # ============================
      - name: Create UDE environment
        uses: microsoft/powerplatform-actions/create-environment@v1.9.2
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

          name: ${{ github.event.inputs.environment_name }}
          environment-type: ${{ github.event.inputs.environment_type }}
          region: ${{ github.event.inputs.region }}
          currency: ${{ github.event.inputs.currency }}
          language: ${{ github.event.inputs.language }}
          domain-name: ${{ github.event.inputs.domain_name }}
          templates: ${{ github.event.inputs.templates }}

          # ✅ YOUR REQUIRED FIX
          max-async-wait-time: 14400

      # ============================
      # Wait for environment readiness
      # ============================
      - name: Wait for environment readiness
        run: |
          echo "Waiting for Dataverse environment..."

          for i in {1..60}
          do
            STATUS=$(pac admin list --output json | jq -r \
              '.[] | select(.DisplayName=="${{ github.event.inputs.environment_name }}") | .State')

            echo "Attempt $i - Status: $STATUS"

            if [ "$STATUS" == "Ready" ]; then
              echo "Environment READY"
              exit 0
            fi

            sleep 60
          done

          echo "Timeout waiting for environment"
          exit 1

      # ============================
      # Extract F&O URL
      # ============================
      - name: Extract F&O URL
        id: fno
        run: |
          ENV_JSON=$(pac admin list --output json)

          FNO_URL=$(echo $ENV_JSON | jq -r '
            .[]
            | select(.DisplayName=="${{ github.event.inputs.environment_name }}")
            | .LinkedEnvironmentMetadata.instanceUrl
          ')

          echo "fno_url=$FNO_URL" >> $GITHUB_OUTPUT
          echo "F&O URL: $FNO_URL"

      # ============================
      # Assign Dataverse System Admin
      # ============================
      - name: Assign Dataverse System Administrator
        run: |
          pac org select --environment ${{ github.event.inputs.environment_name }}

          pac admin assign-user \
            --user "${{ github.event.inputs.user_email }}" \
            --role "System Administrator"

      # ============================
      # Safe F&O sync wait
      # ============================
      - name: Wait for F&O provisioning
        run: |
          echo "Waiting for F&O provisioning..."
          sleep 900

      # ============================
      # Get F&O token
      # ============================
      - name: Get F&O access token
        id: token
        run: |
          FNO_URL=${{ steps.fno.outputs.fno_url }}

          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${{ secrets.PP_TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.PP_CLIENT_SECRET }}" \
            -d "scope=$FNO_URL/.default" \
            -d "grant_type=client_credentials" | jq -r .access_token)

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # ============================
      # Assign F&O role
      # ============================
      - name: Assign F&O role
        run: |
          FNO_URL=${{ steps.fno.outputs.fno_url }}

          curl -X POST "$FNO_URL/data/SecurityUserRoles" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "UserId": "${{ github.event.inputs.user_email }}",
              "SecurityRoleIdentifier": "System administrator"
            }'

      # ============================
      # Summary
      # ============================
      - name: Summary
        run: |
          echo "===================================="
          echo "UDE ENVIRONMENT CREATED SUCCESSFULLY"
          echo "F&O URL: ${{ steps.fno.outputs.fno_url }}"
          echo "User provisioned: ${{ github.event.inputs.user_email }}"
          echo "===================================="

name: Install CE Prerequisites

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Enter Power Platform Environment Name"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  install-applications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Repository Files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -R

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install PAC CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Verify PAC CLI
        run: pac help

      - name: Authenticate PAC using GitHub Federated Credentials
        run: |
          pac auth create \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --githubFederated

      - name: Verify PAC Auth
        run: pac auth list

      - name: Resolve Environment ID
        id: resolve-env
        shell: bash
        run: |
          ENV_NAME="${{ inputs.environment_name }}"
          ENV_NAME_LC=$(echo "$ENV_NAME" | tr '[:upper:]' '[:lower:]')

          echo "Searching environment: $ENV_NAME"
          pac admin list --json > envs.json

          ENV_ID=$(jq -r --arg envNameLc "$ENV_NAME_LC" '
            if type == "array" then
              .
            elif type == "object" and has("value") then
              .value
            else
              []
            end
            | map(
                select(
                  (
                    (.DisplayName // .displayName // .name // .Name // "")
                    | ascii_downcase
                  ) == $envNameLc
                  or
                  (
                    (.DisplayName // .displayName // .name // .Name // "")
                    | ascii_downcase
                    | contains($envNameLc)
                  )
                )
              )
            | .[0]
            | (.EnvironmentId // .environmentId // .id // .Id // empty)
          ' envs.json)

          if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then
            echo "ERROR: Environment not found for name: $ENV_NAME"
            exit 1
          fi

          echo "Resolved Environment ID: $ENV_ID"
          echo "environment_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Validate JSON File
        shell: bash
        run: |
          JSON_FILE="$GITHUB_WORKSPACE/ce-prerequisites.json"

          echo "Checking JSON file at: $JSON_FILE"

          if [ ! -f "$JSON_FILE" ]; then
            echo "ERROR: ce-prerequisites.json not found in repository root!"
            ls -R
            exit 1
          fi

          jq empty "$JSON_FILE"
          echo "JSON syntax is valid."

          if ! jq -e 'type == "array"' "$JSON_FILE" > /dev/null; then
            echo "ERROR: JSON root must be an array."
            exit 1
          fi

          INVALID_COUNT=$(jq '
            [
              .[]
              | select(
                  (.friendlyName == null or .friendlyName == "") or
                  (.applicationId == null or .applicationId == "") or
                  (.uniqueName == null or .uniqueName == "")
                )
            ] | length
          ' "$JSON_FILE")

          if [ "$INVALID_COUNT" -gt 0 ]; then
            echo "ERROR: One or more application entries are missing friendlyName, applicationId, or uniqueName."
            jq '
              .[]
              | select(
                  (.friendlyName == null or .friendlyName == "") or
                  (.applicationId == null or .applicationId == "") or
                  (.uniqueName == null or .uniqueName == "")
                )
            ' "$JSON_FILE"
            exit 1
          fi

          echo "JSON structure is valid."

      - name: Install CE Applications
        shell: bash
        run: |
          ENV_ID="${{ steps.resolve-env.outputs.environment_id }}"
          JSON_FILE="$GITHUB_WORKSPACE/ce-prerequisites.json"
          FAILURES=0

          echo "Installing applications into environment: $ENV_ID"

          jq -c '.[]' "$JSON_FILE" | while IFS= read -r app; do
            FRIENDLY_NAME=$(echo "$app" | jq -r '.friendlyName')
            APPLICATION_ID=$(echo "$app" | jq -r '.applicationId')
            UNIQUE_NAME=$(echo "$app" | jq -r '.uniqueName')

            echo "===================================="
            echo "Installing: $FRIENDLY_NAME"
            echo "Application ID: $APPLICATION_ID"
            echo "Unique Name: $UNIQUE_NAME"
            echo "===================================="

            if [ -z "$UNIQUE_NAME" ] || [ "$UNIQUE_NAME" = "null" ]; then
              echo "FAILED: uniqueName is missing for $FRIENDLY_NAME"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            if pac application install \
              --environment-id "$ENV_ID" \
              --application-name "$UNIQUE_NAME"; then
              echo "SUCCESS: $FRIENDLY_NAME installed"
            else
              echo "FAILED: $FRIENDLY_NAME"
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "One or more application installations failed."
            exit 1
          fi

          echo "All applications processed successfully."
``

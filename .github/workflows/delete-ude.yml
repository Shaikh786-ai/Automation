name: Delete UDE (OIDC, no secrets)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Enter Power Platform Environment Name"
        required: true
        type: string

  push:
    branches:
      - My_Automation

permissions:
  id-token: write
  contents: read

jobs:
  delete-ude:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - uses: actions/checkout@v4

      # Install PAC CLI wrapper actions
      - uses: microsoft/powerplatform-actions/actions-install@v1

      # Resolve Environment ID from Environment Name
      - name: Resolve Environment ID
        id: resolve-env
        shell: bash
        env:
          PP_TOOLS_APP_ID: ${{ secrets.CLIENT_ID }}
          PP_TOOLS_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          ENV_NAME="${{ github.event.inputs.environment_name }}"

          echo "Searching for environment: $ENV_NAME"

          pac auth create \
            --applicationId "$PP_TOOLS_APP_ID" \
            --tenant "$PP_TOOLS_TENANT_ID" \
            --githubFederated

          ENV_ID=$(pac admin list --json | jq -r \
            ".[] | select(.displayName == \"$ENV_NAME\") | .environmentId" | head -n 1)

          if [ -z "$ENV_ID" ] || [ "$ENV_ID" == "null" ]; then
            echo "Environment not found!"
            exit 1
          fi

          echo "Resolved Environment ID: $ENV_ID"

          echo "environment_id=$ENV_ID" >> $GITHUB_OUTPUT

      # Delete Environment
      - name: Delete UDE environment
        uses: microsoft/powerplatform-actions/delete-environment@v1
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          environment-id: ${{ steps.resolve-env.outputs.environment_id }}
          force: true
          wait-for-completion: true
          max-async-wait-time: 90

name: Install CE Prerequisites

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Enter Power Platform Environment Name"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  install-applications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Repository Structure
        run: |
          echo "Current working directory:"
          pwd
          echo "Repository files:"
          ls -R

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install PAC CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify PAC CLI
        run: |
          pac help

      - name: Authenticate PAC using GitHub Federated Credentials
        run: |
          pac auth create \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --githubFederated

      - name: Verify PAC Auth
        run: |
          pac auth list

      - name: Resolve Environment ID
        id: resolve-env
        shell: bash
        run: |
          ENV_NAME="${{ github.event.inputs.environment_name }}"
          ENV_NAME_LC=$(echo "$ENV_NAME" | tr '[:upper:]' '[:lower:]')

          echo "Searching environment: $ENV_NAME"

          pac admin list --json > envs.json

          echo "===== Raw envs.json ====="
          cat envs.json
          echo "========================="


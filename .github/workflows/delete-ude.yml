name: Delete UDE (OIDC, no secrets)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Enter Power Platform Environment Name"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  delete-ude:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - uses: actions/checkout@v4

      # Install Power Platform CLI
      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # Verify PAC CLI
      - name: Verify PAC CLI
        run: pac help

      # Authenticate PAC CLI using OIDC
      - name: Authenticate PAC CLI
        env:
          PP_TOOLS_APP_ID: ${{ secrets.CLIENT_ID }}
          PP_TOOLS_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          pac auth create \
            --applicationId "$PP_TOOLS_APP_ID" \
            --tenant "$PP_TOOLS_TENANT_ID" \
            --githubFederated

      # Resolve Environment ID from Name
      - name: Resolve Environment ID
        id: resolve-env
        shell: bash
        run: |
          ENV_NAME="${{ github.event.inputs.environment_name }}"

          echo "Searching for environment: $ENV_NAME"

          pac admin list --json > envs.json
          cat envs.json

          ENV_ID=$(jq -r \
            ".[] | select(.DisplayName == \"$ENV_NAME\") | .EnvironmentId" envs.json | head -n 1)

          if [ -z "$ENV_ID" ] || [ "$ENV_ID" == "null" ]; then
            echo "Environment not found!"
            exit 1
          fi

          echo "Resolved Environment ID: $ENV_ID"
          echo "environment_id=$ENV_ID" >> $GITHUB_OUTPUT

      # Delete Environment (UPDATED FIX)
      - name: Delete UDE environment
        uses: microsoft/powerplatform-actions/delete-environment@v1
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

          # NEW REQUIRED INPUT (replaces environment-id)
          environment: ${{ steps.resolve-env.outputs.environment_id }}

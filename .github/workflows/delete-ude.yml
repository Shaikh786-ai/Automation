name: Delete UDE (OIDC, no secrets)

on:
  workflow_dispatch:
    inputs:
      environment_id:
        description: "Enter Power Platform Environment ID"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  delete-ude:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: Install PAC CLI only for visibility/debugging
      # Not required for delete-environment action itself
      - name: Install PAC CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # Optional: Verify PAC CLI installation
      - name: Verify PAC CLI
        run: pac help

      # Validate workflow input
      - name: Validate Environment ID input
        shell: bash
        run: |
          ENV_ID="${{ github.event.inputs.environment_id }}"

          if [ -z "$ENV_ID" ]; then
            echo "Environment ID is required."
            exit 1
          fi

          echo "Environment ID received: $ENV_ID"

      # Delete Environment
      - name: Delete UDE environment
        uses: microsoft/powerplatform-actions/delete-environment@v1
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          environment: ${{ github.event.inputs.environment_id }}
          cloud: Public

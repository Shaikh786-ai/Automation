#Workflow metadata - Defines the workflow name and enables manual execution from GitHub Actions.

name: Copy Dataverse DB (URL choice based, OIDC)

on:
  workflow_dispatch:
    inputs:

    #Source Environment Input - Allows the user to select the source Dataverse environment URL.
      source_env_url:
        description: "Select Source Environment"
        required: true
        type: choice
        options:
          - https://ude-finops-ges.crm.dynamics.com/
          - https://ude-finops-us-ges.crm.dynamics.com/

    #Target Environment Input - Allows the user to select the target Dataverse environment URL.
      target_env_url:
        description: "Select Target Environment"
        required: true
        type: choice
        options:
          - https://ude-finops-us-ges.crm.dynamics.com/
          - https://ude-finops-ges.crm.dynamics.com/

    #Copy Type Input - Defines whether the database copy should be full or minimal.
      copy_type:
        description: "Copy Type"
        required: true
        default: FullCopy
        type: choice
        options:
          - FullCopy
          - MinimalCopy

    #Wait Time Input - Specifies the maximum wait time for the asynchronous database copy operation.
      wait_minutes:
        description: "Max async wait time (minutes)"
        required: true
        default: "240"
        type: string

#Workflow Permissions - Grants GitHub OIDC authentication and repository read permissions.
permissions:
  id-token: write
  contents: read

#Job Definition - Defines the database copy job and the Ubuntu runner environment.
jobs:
  copy-db:
    runs-on: ubuntu-latest

#Checkout Repository - Downloads repository files into the GitHub Actions runner.
    steps:
      - uses: actions/checkout@v4

      # Install PAC CLI - Installs Microsoft Power Platform CLI tools required for PAC commands.
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Ensure PAC CLI exists - Checks whether PAC CLI exists and installs it if missing.
      - name: Ensure PAC CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pac >/dev/null 2>&1; then
            dotnet tool install -g Microsoft.PowerApps.CLI.Tool
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi
          pac help >/dev/null

      # OIDC Authentication - Authenticates PAC CLI using GitHub OIDC federated credentials without secrets.
      - name: PAC auth (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          pac auth clear || true
          pac auth create \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --applicationId "${{ secrets.CLIENT_ID }}" \
            --githubFederated

          echo "✅ Authenticated"
          pac auth who

      # Validate environments - Verifies access to available Power Platform environments.
      - name: Validate environment access
        run: pac org list

      # 🚀 Copy Dataverse database - Resolves environment IDs and performs the Dataverse database copy operation.
      - name: Copy Dataverse database
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ENV_URL="${{ github.event.inputs.source_env_url }}"
          TARGET_ENV_URL="${{ github.event.inputs.target_env_url }}"
          COPY_TYPE="${{ github.event.inputs.copy_type }}"
          WAIT_MINUTES="${{ github.event.inputs.wait_minutes }}"

          echo "SOURCE URL: $SOURCE_ENV_URL"
          echo "TARGET URL: $TARGET_ENV_URL"

          # Resolve SOURCE ENV ID
          pac org select --environment "$SOURCE_ENV_URL"
          SOURCE_ENV_ID=$(pac org who --json | jq -r '.EnvironmentId')

          # Resolve TARGET ENV ID + Friendly Name
          pac org select --environment "$TARGET_ENV_URL"
          TARGET_ENV_ID=$(pac org who --json | jq -r '.EnvironmentId')
          TARGET_DISPLAY_NAME=$(pac org who --json | jq -r '.FriendlyName')

          if [ -z "$TARGET_DISPLAY_NAME" ] || [ "$TARGET_DISPLAY_NAME" = "null" ]; then
            echo "❌ Could not resolve target environment display name"
            pac org who
            exit 1
          fi

          echo "SOURCE_ENV_ID=$SOURCE_ENV_ID"
          echo "TARGET_ENV_ID=$TARGET_ENV_ID"
          echo "TARGET_DISPLAY_NAME=$TARGET_DISPLAY_NAME"

          case "$COPY_TYPE" in
            FullCopy|MinimalCopy) ;;
            *) echo "❌ Invalid COPY_TYPE" && exit 2 ;;
          esac

          pac admin copy \
            --name "$TARGET_DISPLAY_NAME" \
            --source-env "$SOURCE_ENV_ID" \
            --target-env "$TARGET_ENV_ID" \
            --type "$COPY_TYPE" \
            --async false \
            --max-async-wait-time "$WAIT_MINUTES"

#Completion Message - Displays a success message after the database copy completes.
      - name: Done
        run: echo "✅ Database copy completed."
